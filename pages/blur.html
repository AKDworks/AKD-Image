<!DOCTYPE html>
<html lang="ru">
<head>
  <script src="/js/i18n.js?v=5"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Размытие области – AKD Image</title>
  <meta name="description" content="Скрывайте области JPG, PNG, WebP, AVIF, HEIC/HEIF, SVG, BMP или GIF размытием, пикселизацией или чёрной заливкой.">
  <link rel="canonical" href="https://image.akdworks.com/blur">
  <link rel="icon" href="/assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/fonts/Inter-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/Inter-500.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/Inter-600.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/Inter-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/Inter-800.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/css/main.css?v=61">
</head>
<body>
<script src="/js/layout.js?v=21"></script>

<main>
  <div class="container container--narrow tool-page">

    <div class="tool-page__header">
      <h1 class="tool-page__title">Размытие области</h1>
      <p class="tool-page__subtitle">Скройте лицо, номер, логин или фрагмент скриншота размытием, пикселизацией или чёрной заливкой.</p>
    </div>

    <div class="dropzone" id="dropzone">
      <input type="file" accept="image/jpeg,image/png,image/webp,image/avif,image/heic,image/heif,image/svg+xml,image/bmp,image/gif">
      <p class="dropzone__title">Добавьте изображения</p>
      <p class="dropzone__hint">Выберите файлы, вставьте из буфера или перетащите сюда</p>
      <div class="dropzone__formats">
        <span class="fmt-badge">JPG</span>
        <span class="fmt-badge">PNG</span>
        <span class="fmt-badge">WEBP</span>
        <span class="fmt-badge">AVIF</span>
        <span class="fmt-badge">HEIC</span>
        <span class="fmt-badge">SVG</span>
        <span class="fmt-badge">BMP</span>
        <span class="fmt-badge">GIF</span>
      </div>
    </div>

    <div class="tool-panel hidden" id="workspace-panel">
      <div class="tool-panel__head">
        <h3>Область обработки</h3>
        <button class="btn btn-sm btn-secondary" id="change-img-btn" data-open-file-picker>Заменить файл</button>
      </div>
      <div class="tool-panel__body">
        <div class="crop-workspace">
          <div class="crop-container" id="blur-container">
            <img class="crop-image" id="source-img" alt="Редактируемое изображение">
            <div class="crop-box blur-box" id="blur-box">
              <div class="crop-grid" aria-hidden="true">
                <span class="crop-grid__line crop-grid__line--vertical crop-grid__line--first"></span>
                <span class="crop-grid__line crop-grid__line--vertical crop-grid__line--second"></span>
                <span class="crop-grid__line crop-grid__line--horizontal crop-grid__line--first"></span>
                <span class="crop-grid__line crop-grid__line--horizontal crop-grid__line--second"></span>
                <span class="crop-grid__center"></span>
              </div>
              <div class="crop-handle handle-nw" data-handle="nw"></div>
              <div class="crop-handle handle-ne" data-handle="ne"></div>
              <div class="crop-handle handle-sw" data-handle="sw"></div>
              <div class="crop-handle handle-se" data-handle="se"></div>
              <div class="crop-handle handle-n"  data-handle="n"></div>
              <div class="crop-handle handle-s"  data-handle="s"></div>
              <div class="crop-handle handle-w"  data-handle="w"></div>
              <div class="crop-handle handle-e"  data-handle="e"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="tool-panel hidden" id="settings-panel">
      <div class="tool-panel__head">
        <h3>Настройки области</h3>
      </div>
      <div class="tool-panel__body">
        <div class="form-group">
          <label>Способ обработки</label>
          <div class="radio-group" id="blur-mode-group">
            <label class="radio-option"><input type="radio" name="blur-mode" value="blur" checked> Размытие</label>
            <label class="radio-option"><input type="radio" name="blur-mode" value="pixelate"> Пикселизация</label>
            <label class="radio-option"><input type="radio" name="blur-mode" value="black"> Чёрный квадрат</label>
          </div>
        </div>

        <div class="form-group mt-16" id="blur-strength-group">
          <label>Сила размытия</label>
          <div class="range-row">
            <input type="range" id="blur-radius" min="2" max="40" value="14">
            <span id="blur-radius-val">14px</span>
          </div>
        </div>

        <div class="form-group mt-16 hidden" id="pixel-strength-group">
          <label>Размер пикселя</label>
          <div class="range-row">
            <input type="range" id="pixel-size" min="4" max="64" value="16">
            <span id="pixel-size-val">16px</span>
          </div>
        </div>

        <div class="form-row blur-dimensions-grid">
          <div class="form-group">
            <label>X (слева, px)</label>
            <input type="number" id="area-x" value="0" min="0">
          </div>
          <div class="form-group">
            <label>Y (сверху, px)</label>
            <input type="number" id="area-y" value="0" min="0">
          </div>
          <div class="form-group">
            <label>Ширина (px)</label>
            <input type="number" id="area-w" value="100" min="1">
          </div>
          <div class="form-group">
            <label>Высота (px)</label>
            <input type="number" id="area-h" value="100" min="1">
          </div>
        </div>

      </div>
    </div>

    <div class="hidden mt-16 flex gap-8 items-center" id="action-bar">
      <button class="btn btn-primary btn-lg" id="apply-blur-btn">Размыть область</button>
    </div>

    <div class="result-area" id="result-area">
      <hr class="divider">
      <div class="result-stats" id="result-stats"></div>
      <div class="crop-result-preview">
        <img class="crop-result-preview__img" id="result-img" alt="Результат обработки">
      </div>
      <div class="flex gap-8 mt-16 flex-wrap">
        <button class="btn btn-success" id="download-btn">Скачать результат</button>
        <button class="btn btn-secondary" id="copy-btn">Копировать в буфер</button>
      </div>
    </div>

  </div>
</main>

<script src="/js/core.js?v=23"></script>
<script>
(function () {
  const dropzoneEl   = document.getElementById('dropzone');
  const workspaceEl  = document.getElementById('workspace-panel');
  const settingsEl   = document.getElementById('settings-panel');
  const actionBarEl  = document.getElementById('action-bar');
  const changeImgBtn = document.getElementById('change-img-btn');
  const applyBlurBtn = document.getElementById('apply-blur-btn');
  const resultArea   = document.getElementById('result-area');
  const resultStats  = document.getElementById('result-stats');
  const resultImg    = document.getElementById('result-img');
  const downloadBtn  = document.getElementById('download-btn');
  const copyBtn      = document.getElementById('copy-btn');

  const sourceImg    = document.getElementById('source-img');
  const blurBox      = document.getElementById('blur-box');

  const inpX = document.getElementById('area-x');
  const inpY = document.getElementById('area-y');
  const inpW = document.getElementById('area-w');
  const inpH = document.getElementById('area-h');

  const blurRadius = document.getElementById('blur-radius');
  const blurRadiusVal = document.getElementById('blur-radius-val');
  const pixelSize = document.getElementById('pixel-size');
  const pixelSizeVal = document.getElementById('pixel-size-val');
  const blurStrengthGroup = document.getElementById('blur-strength-group');
  const pixelStrengthGroup = document.getElementById('pixel-strength-group');
  const modeInputs = Array.from(document.querySelectorAll('input[name="blur-mode"]'));
  let activeFile = null;
  let imgNaturalW = 0;
  let imgNaturalH = 0;
  let areaState = { x: 0, y: 0, w: 0, h: 0 };
  let renderW = 0;
  let renderH = 0;
  let resultBlob = null;

  blurRadius.addEventListener('input', () => {
    blurRadiusVal.textContent = `${blurRadius.value}px`;
  });
  pixelSize.addEventListener('input', () => {
    pixelSizeVal.textContent = `${pixelSize.value}px`;
  });

  const modeConfig = {
    blur: {
      button: 'Размыть область',
      loading: 'Размываю...',
      suffix: 'blur',
      statLabel: 'Размытие',
      success: 'Область размыта.',
      error: 'Не удалось размыть область.',
    },
    pixelate: {
      button: 'Пикселизировать область',
      loading: 'Пикселизирую...',
      suffix: 'pixelated',
      statLabel: 'Размер пикселя',
      success: 'Область пикселизирована.',
      error: 'Не удалось пикселизировать область.',
    },
    black: {
      button: 'Закрыть область',
      loading: 'Закрываю...',
      suffix: 'hidden',
      statLabel: 'Способ',
      success: 'Область закрыта.',
      error: 'Не удалось закрыть область.',
    },
  };

  function getMode() {
    return modeInputs.find(input => input.checked)?.value || 'blur';
  }

  function updateModeUI() {
    const mode = getMode();
    UIUtils.setVisible(blurStrengthGroup, mode === 'blur');
    UIUtils.setVisible(pixelStrengthGroup, mode === 'pixelate');
    applyBlurBtn.textContent = modeConfig[mode].button;
  }

  modeInputs.forEach(input => input.addEventListener('change', updateModeUI));
  updateModeUI();
  new Dropzone(dropzoneEl, {
    accept: ['image/jpeg','image/png','image/webp','image/avif','image/heic','image/heif','image/svg+xml','image/bmp','image/gif'],
    multiple: false,
    onFiles(newFiles) {
      if (newFiles[0]) loadImageFile(newFiles[0]);
    }
  });

  function setEditingVisible(visible) {
    UIUtils.setVisible(dropzoneEl, !visible);
    UIUtils.setVisible(workspaceEl, visible);
    UIUtils.setVisible(settingsEl, visible);
    UIUtils.setVisible(actionBarEl, visible);
    resultArea.classList.remove('visible');
  }

  changeImgBtn.addEventListener('click', () => {
    activeFile = null;
    resultImg.removeAttribute('src');
    setEditingVisible(false);
  });

  async function loadImageFile(file) {
    try {
      const dataURL = await FileUtils.readAsDataURL(file);
      const loadedImage = await FileUtils.loadImage(dataURL);
      activeFile = file;
      imgNaturalW = loadedImage.naturalWidth;
      imgNaturalH = loadedImage.naturalHeight;

      inpX.max = imgNaturalW;
      inpY.max = imgNaturalH;
      inpW.max = imgNaturalW;
      inpH.max = imgNaturalH;

      const w = Math.round(imgNaturalW * 0.35);
      const h = Math.round(imgNaturalH * 0.25);
      const x = Math.round((imgNaturalW - w) / 2);
      const y = Math.round((imgNaturalH - h) / 2);
      areaState = { x, y, w, h };

      sourceImg.onload = () => requestAnimationFrame(updateUIFromState);
      sourceImg.src = dataURL;
      UIUtils.showSelectedFileInfo(workspaceEl, file, {
        width: imgNaturalW,
        height: imgNaturalH,
      });
      setEditingVisible(true);
    } catch (err) {
      console.error(err);
      activeFile = null;
      setEditingVisible(false);
      Toast.error(err.message || 'Не удалось загрузить изображение.');
    }
  }

  window.addEventListener('resize', () => {
    if (activeFile) updateUIFromState();
  });

  function updateUIFromState() {
    renderW = sourceImg.offsetWidth;
    renderH = sourceImg.offsetHeight;
    if (!renderW || !renderH) return;

    const scale = renderW / imgNaturalW;
    blurBox.style.left = `${areaState.x * scale}px`;
    blurBox.style.top = `${areaState.y * scale}px`;
    blurBox.style.width = `${areaState.w * scale}px`;
    blurBox.style.height = `${areaState.h * scale}px`;

    inpX.value = Math.round(areaState.x);
    inpY.value = Math.round(areaState.y);
    inpW.value = Math.round(areaState.w);
    inpH.value = Math.round(areaState.h);
  }

  function updateStateFromInputs() {
    let x = parseInt(inpX.value) || 0;
    let y = parseInt(inpY.value) || 0;
    let w = parseInt(inpW.value) || 100;
    let h = parseInt(inpH.value) || 100;

    x = Math.max(0, Math.min(imgNaturalW - 1, x));
    y = Math.max(0, Math.min(imgNaturalH - 1, y));
    w = Math.max(1, Math.min(imgNaturalW - x, w));
    h = Math.max(1, Math.min(imgNaturalH - y, h));

    areaState = { x, y, w, h };
    updateUIFromState();
  }

  [inpX, inpY, inpW, inpH].forEach(input => {
    input.addEventListener('change', updateStateFromInputs);
  });

  let isDragging = false;
  let dragMode = 'move';
  let startX = 0, startY = 0;
  let startArea = {};

  blurBox.addEventListener('mousedown', startDrag);
  blurBox.addEventListener('touchstart', startDrag, { passive: false });

  function startDrag(e) {
    e.preventDefault();
    isDragging = true;

    const event = e.type.startsWith('touch') ? e.touches[0] : e;
    startX = event.clientX;
    startY = event.clientY;
    startArea = { ...areaState };
    dragMode = e.target.dataset.handle || 'move';

    window.addEventListener('mousemove', drag);
    window.addEventListener('touchmove', drag, { passive: false });
    window.addEventListener('mouseup', endDrag);
    window.addEventListener('touchend', endDrag);
  }

  function drag(e) {
    if (!isDragging) return;
    e.preventDefault();

    const event = e.type.startsWith('touch') ? e.touches[0] : e;
    const dx = (event.clientX - startX) * (imgNaturalW / renderW);
    const dy = (event.clientY - startY) * (imgNaturalH / renderH);

    let x = startArea.x;
    let y = startArea.y;
    let w = startArea.w;
    let h = startArea.h;

    if (dragMode === 'move') {
      x = Math.max(0, Math.min(imgNaturalW - w, x + dx));
      y = Math.max(0, Math.min(imgNaturalH - h, y + dy));
    } else {
      if (dragMode.includes('e')) w = Math.max(10, Math.min(imgNaturalW - x, w + dx));
      if (dragMode.includes('s')) h = Math.max(10, Math.min(imgNaturalH - y, h + dy));
      if (dragMode.includes('w')) {
        const nx = Math.max(0, Math.min(x + w - 10, x + dx));
        w = w + (x - nx);
        x = nx;
      }
      if (dragMode.includes('n')) {
        const ny = Math.max(0, Math.min(y + h - 10, y + dy));
        h = h + (y - ny);
        y = ny;
      }
    }

    areaState = {
      x: Math.round(x),
      y: Math.round(y),
      w: Math.round(w),
      h: Math.round(h)
    };

    updateUIFromState();
  }

  function endDrag() {
    isDragging = false;
    window.removeEventListener('mousemove', drag);
    window.removeEventListener('touchmove', drag);
    window.removeEventListener('mouseup', endDrag);
    window.removeEventListener('touchend', endDrag);
  }

  applyBlurBtn.addEventListener('click', async () => {
    if (!activeFile) return;

    const mode = getMode();
    const config = modeConfig[mode];
    applyBlurBtn.disabled = true;
    applyBlurBtn.innerHTML = `<span class="spinner"></span> ${config.loading}`;

    try {
      const mime = FileUtils.resolveOutputMime(activeFile, 'same');
      const quality = 0.95;
      const processed = await ImageProcessor.process(activeFile, {
        type: 'blurArea',
        area: {
          x: areaState.x,
          y: areaState.y,
          width: areaState.w,
          height: areaState.h,
        },
        mode,
        radius: parseInt(blurRadius.value),
        pixelSize: parseInt(pixelSize.value),
        mimeType: mime,
        quality,
      });
      resultBlob = processed.blob;

      resultImg.src = await FileUtils.readAsDataURL(resultBlob);

      const ext = FileUtils.extensionForMime(mime);
      const filename = activeFile.name.replace(/\.[^.]+$/, '') + `_${config.suffix}.` + ext;

      const modeValue = mode === 'blur'
        ? `${blurRadius.value}px`
        : mode === 'pixelate'
          ? `${pixelSize.value}px`
          : 'Чёрная заливка';

      resultStats.innerHTML = `
        <div class="stat-card"><div class="stat-card__label">Область</div><div class="stat-card__value">${areaState.w}×${areaState.h}px</div></div>
        <div class="stat-card"><div class="stat-card__label">${config.statLabel}</div><div class="stat-card__value">${modeValue}</div></div>
        <div class="stat-card stat-green"><div class="stat-card__label">Размер файла</div><div class="stat-card__value">${FileUtils.formatSize(resultBlob.size)}</div></div>
      `;
      resultArea.classList.add('visible');
      UIUtils.setVisible(copyBtn, mime !== 'image/gif');

      downloadBtn.onclick = () => FileUtils.downloadBlob(resultBlob, filename);
      copyBtn.onclick = async () => {
        try {
          const copyBlob = mime === 'image/png'
            ? resultBlob
            : (await ImageProcessor.process(resultBlob, {
                type: 'transcode',
                mimeType: 'image/png',
                quality: 1,
              })).blob;
          await navigator.clipboard.write([new ClipboardItem({ 'image/png': copyBlob })]);
          Toast.success('Изображение скопировано в буфер.');
        } catch (err) {
          Toast.error('Копирование не поддерживается браузером, скачайте изображение.');
        }
      };

      Toast.success(config.success);
      resultArea.scrollIntoView({ behavior: 'smooth' });
    } catch (err) {
      console.error(err);
      Toast.error(err.message || config.error);
    }

    applyBlurBtn.disabled = false;
    applyBlurBtn.textContent = config.button;
  });
})();
</script>
</body>
</html>
