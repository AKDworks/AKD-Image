<!DOCTYPE html>
<html lang="ru">
<head>
  <script src="/js/i18n.js?v=18"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Водяной знак – AKD Image</title>
  <meta name="description" content="Добавляйте текстовый водяной знак к одному изображению или целому набору с локальной обработкой в браузере.">
  <link rel="canonical" href="https://image.akdworks.com/watermark">
  <link rel="icon" href="/assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/fonts/Inter-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/Inter-500.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/Inter-600.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/Inter-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/Inter-800.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/css/main.css?v=75">
</head>
<body>
<script src="/js/layout.js?v=22"></script>

<main>
  <div class="container container--narrow tool-page">

    <div class="tool-page__header">
      <h1 class="tool-page__title">
        Водяной знак
      </h1>
      <p class="tool-page__subtitle">Добавьте текстовый водяной знак, настройте его оформление и примените к одному изображению или целому набору.</p>
    </div>
    <div class="dropzone" id="dropzone">
      <input type="file" accept="image/jpeg,image/png,image/webp,image/avif,image/heic,image/heif,image/svg+xml,image/bmp,image/gif" multiple>
      <p class="dropzone__title">Добавьте изображения</p>
      <p class="dropzone__hint">Выберите файлы, вставьте из буфера или перетащите сюда</p>
      <div class="dropzone__formats">
        <span class="fmt-badge">JPG</span>
        <span class="fmt-badge">PNG</span>
        <span class="fmt-badge">WEBP</span>
        <span class="fmt-badge">AVIF</span>
        <span class="fmt-badge">HEIC</span>
        <span class="fmt-badge">SVG</span>
        <span class="fmt-badge">BMP</span>
        <span class="fmt-badge">GIF</span>
      </div>
    </div>
    <div class="tool-panel hidden" id="settings-panel">
      <div class="tool-panel__head">
        <h3>Водяной знак</h3>
        <div class="tool-panel__head-actions">
          <button class="btn btn-sm btn-secondary" type="button" data-open-file-picker>Добавить файлы</button>
          <button class="btn btn-sm btn-secondary" id="clear-btn" type="button" data-open-file-picker>Заменить файлы</button>
        </div>
      </div>
      <div class="tool-panel__body">
        <div class="wm-text-settings">
          <div class="form-row wm-text-row">
            <div class="form-group flex-1">
              <label>Текст водяного знака</label>
              <input type="text" id="wm-text" value="© AKD Image" placeholder="Введите текст...">
            </div>
          </div>
          <div class="form-row mt-8 wm-typography-grid">
            <div class="form-group">
              <label>Цвет текста</label>
              <input type="color" class="color-input" id="wm-color" value="#ffffff">
            </div>
            <div class="form-group">
              <label>Шрифт</label>
              <select id="wm-font">
                <option value="Inter, sans-serif" data-preview-font="Inter, sans-serif">Inter (по умолчанию)</option>
                <option value="serif" data-preview-font="serif">Serif</option>
                <option value="monospace" data-preview-font="monospace">Monospace</option>
                <option value="Arial, sans-serif" data-preview-font="Arial, sans-serif">Arial</option>
                <option value="Georgia, serif" data-preview-font="Georgia, serif">Georgia</option>
              </select>
            </div>
          </div>
          <div class="form-group mt-8">
            <label>Стиль</label>
            <div class="radio-group" id="wm-style-group">
              <label class="radio-option"><input type="radio" name="wm-style" value="normal" checked> Обычный</label>
              <label class="radio-option"><input type="radio" name="wm-style" value="bold"> Жирный</label>
              <label class="radio-option"><input type="radio" name="wm-style" value="italic"> Курсив</label>
            </div>
          </div>
        </div>
        <hr class="divider">
        <div class="wm-placement-grid">
          <div class="form-group wm-position-group">
            <label>Позиция</label>
            <div class="position-grid" id="position-grid">
              <button class="pos-btn" type="button" data-pos="top-left" aria-pressed="false">Сверху слева</button>
              <button class="pos-btn" type="button" data-pos="top-right" aria-pressed="false">Сверху справа</button>
              <button class="pos-btn" type="button" data-pos="center" aria-pressed="false">По центру</button>
              <button class="pos-btn" type="button" data-pos="bottom-left" aria-pressed="false">Снизу слева</button>
              <button class="pos-btn active" type="button" data-pos="bottom-right" aria-pressed="true">Снизу справа</button>
              <button class="pos-btn" type="button" data-pos="tile" aria-pressed="false">Плитка</button>
            </div>
          </div>
          <div class="wm-placement-controls">
            <div class="form-group">
              <label>Размер текста</label>
              <div class="range-row">
                <input type="range" id="wm-font-size" min="8" max="200" value="36">
                <span id="wm-font-size-val">36 px</span>
              </div>
            </div>
            <div class="form-group">
              <label>Прозрачность</label>
              <div class="range-row">
                <input type="range" id="wm-opacity" min="5" max="100" value="70">
                <span id="wm-opacity-val">70%</span>
              </div>
            </div>
            <div class="form-group wm-padding-group">
              <label>Отступ от края (px)</label>
              <input type="number" class="wm-padding-input" id="wm-padding" value="20" min="0" max="200">
            </div>
          </div>
        </div>

        <button class="btn btn-secondary mt-16 hidden" id="preview-btn">
          Предпросмотр выбранного изображения
        </button>
        <canvas class="preview-canvas hidden" id="preview-canvas"></canvas>
      </div>
    </div>
    <div class="file-list hidden" id="file-list"></div>
    <div class="hidden mt-16 flex gap-8 items-center" id="action-bar">
      <button class="btn btn-primary btn-lg" id="apply-btn">Добавить водяной знак</button>
      <span class="text-muted text-sm" id="file-count"></span>
    </div>

    <div class="result-area" id="result-area">
      <hr class="divider">
      <div class="result-stats" id="result-stats"></div>
      <button class="btn btn-success hidden" id="download-all-btn">Скачать всё (ZIP)</button>
    </div>

  </div>
</main>

<script src="/js/core.js?v=40"></script>
<script>
(function () {
  const dropzoneEl  = document.getElementById('dropzone');
  const fileListEl  = document.getElementById('file-list');
  const settingsEl  = document.getElementById('settings-panel');
  const actionBarEl = document.getElementById('action-bar');
  const countEl     = document.getElementById('file-count');
  const applyBtn    = document.getElementById('apply-btn');
  const clearBtn    = document.getElementById('clear-btn');
  const resultArea  = document.getElementById('result-area');
  const resultStats = document.getElementById('result-stats');
  const dlAllBtn    = document.getElementById('download-all-btn');
  const previewBtn  = document.getElementById('preview-btn');
  const previewCanvas = document.getElementById('preview-canvas');

  const wmText     = document.getElementById('wm-text');
  const wmColor    = document.getElementById('wm-color');
  const wmFontSize = document.getElementById('wm-font-size');
  const wmFontSizeVal = document.getElementById('wm-font-size-val');
  const wmFont     = document.getElementById('wm-font');
  const wmOpacity  = document.getElementById('wm-opacity');
  const wmOpacityVal = document.getElementById('wm-opacity-val');
  const wmPadding  = document.getElementById('wm-padding');

  wmFontSize.addEventListener('input', () => { wmFontSizeVal.textContent = wmFontSize.value + ' px'; });
  wmOpacity.addEventListener('input', () => { wmOpacityVal.textContent = wmOpacity.value + '%'; });

  let selectedPos = 'bottom-right';
  let tileEnabled = false;
  const positionButtons = Array.from(document.querySelectorAll('.pos-btn'));
  positionButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      positionButtons.forEach(button => {
        button.classList.remove('active');
        button.setAttribute('aria-pressed', 'false');
      });
      btn.classList.add('active');
      btn.setAttribute('aria-pressed', 'true');
      tileEnabled = btn.dataset.pos === 'tile';
      if (!tileEnabled) selectedPos = btn.dataset.pos;
      previewScheduler.schedule();
    });
  });

  const manager = new FileListManager(fileListEl);
  let files = [], results = [];

  fileListEl.addEventListener('file-removed', (e) => {
    files = files.filter(f => f.item.id !== e.detail.id);
    updateUI();
  });
  new Dropzone(dropzoneEl, {
    accept: ['image/jpeg','image/png','image/webp','image/avif','image/heic','image/heif','image/svg+xml','image/bmp','image/gif'],
    multiple: true,
    onFiles(newFiles) {
      newFiles.forEach(f => files.push({ file: f, item: manager.add(f) }));
      updateUI();
    }
  });

  function updateUI() {
    const has = UIUtils.updateBatchLayout({ dropzoneEl, fileListEl, settingsEl, actionBarEl, countEl }, files.length);
    UIUtils.resetBatchResult({ resultArea, resultStats, downloadAllBtn: dlAllBtn });
    UIUtils.resetPreview({ previewBtn, previewCanvas }, has);
    results = [];
    if (has) previewScheduler.refresh();
  }

  clearBtn.addEventListener('click', () => { files = []; manager.clear(); updateUI(); });

  async function applyWatermark(img) {
    const canvas = document.createElement('canvas');
    canvas.width  = img.naturalWidth || img.width;
    canvas.height = img.naturalHeight || img.height;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0);

    const opacity = Math.min(1, Math.max(0, Number(wmOpacity.value) / 100));
    const pad     = parseInt(wmPadding.value) || 0;
    ctx.globalAlpha = opacity;

    const text     = wmText.value || '© AKD Image';
    const fontSize = parseInt(wmFontSize.value) || 36;
    const style    = document.querySelector('input[name="wm-style"]:checked').value;
    ctx.font       = `${style === 'italic' ? 'italic ' : ''}${style === 'bold' ? 'bold ' : ''}${fontSize}px ${wmFont.value}`;
    ctx.fillStyle  = wmColor.value;
    ctx.textBaseline = 'middle';

    if (tileEnabled) {
      ctx.save();
      ctx.globalAlpha = opacity;
      const metrics = ctx.measureText(text);
      const tw = metrics.width + 60, th = fontSize + 40;
      for (let y = -canvas.height; y < canvas.height * 2; y += th) {
        for (let x = -canvas.width; x < canvas.width * 2; x += tw) {
          ctx.save();
          ctx.translate(x + tw/2, y + th/2);
          ctx.rotate(-Math.PI / 6);
          ctx.fillText(text, 0, 0);
          ctx.restore();
        }
      }
      ctx.restore();
    } else {
      const metrics = ctx.measureText(text);
      const tw = metrics.width;
      const [x, y] = calcPos(canvas.width, canvas.height, tw, fontSize, pad, selectedPos);
      ctx.fillText(text, x, y);
    }

    ctx.globalAlpha = 1;
    return canvas;
  }

  function calcPos(cw, ch, ew, eh, pad, pos) {
    const positions = {
      'top-left':      [pad, pad + eh/2],
      'top-center':    [cw/2 - ew/2, pad + eh/2],
      'top-right':     [cw - ew - pad, pad + eh/2],
      'middle-left':   [pad, ch/2],
      'center':        [cw/2 - ew/2, ch/2],
      'middle-right':  [cw - ew - pad, ch/2],
      'bottom-left':   [pad, ch - pad - eh/2],
      'bottom-center': [cw/2 - ew/2, ch - pad - eh/2],
      'bottom-right':  [cw - ew - pad, ch - pad - eh/2],
    };
    return positions[pos] || positions['bottom-right'];
  }

  const previewScheduler = UIUtils.createPreviewScheduler(async isCurrent => {
    if (!files.length) return;
    const dataURL = await FileUtils.readAsDataURL(manager.getSelectedItem().file);
    const img = await FileUtils.loadImage(dataURL);
    if (!isCurrent()) return;
    const canvas = await applyWatermark(img);
    previewCanvas.width = canvas.width;
    previewCanvas.height = canvas.height;
    previewCanvas.getContext('2d').drawImage(canvas, 0, 0);
    previewCanvas.classList.remove('hidden');
  });

  previewBtn.addEventListener('click', previewScheduler.refresh);
  fileListEl.addEventListener('file-selected', previewScheduler.refresh);
  settingsEl.addEventListener('input', previewScheduler.schedule);
  settingsEl.addEventListener('change', previewScheduler.schedule);

  applyBtn.addEventListener('click', async () => {
    if (!files.length) return;
    applyBtn.disabled = true;
    UIUtils.setBatchLocked(manager, [clearBtn, dlAllBtn, previewBtn], true);
    applyBtn.innerHTML = '<span class="spinner"></span> Обработка...';
    results = [];
    let errors = 0;

    for (const entry of files) {
      const { file, item } = entry;
      manager.setStatus(item.id, 'Обработка...', 'status-processing');
      manager.setProgress(item.id, 20);

      try {
        const mime    = FileUtils.resolveOutputMime(file, 'same');
        const quality = 0.95;
        let blob;

        if (FileUtils.isGif(file)) {
          const processed = await GifProcessor.process(file, {
            quality,
            onProgress: progress => manager.setProgress(item.id, progress),
            transformFrame: ({ sourceCanvas }) => applyWatermark(sourceCanvas),
          });
          blob = processed.blob;
        } else {
          const dataURL = await FileUtils.readAsDataURL(file);
          const img = await FileUtils.loadImage(dataURL);
          manager.setProgress(item.id, 50);
          const canvas = await applyWatermark(img);
          const outputCanvas = FileUtils.canvasForMime(canvas, mime);
          blob = mime === 'image/gif'
            ? await GifProcessor.encodeCanvas(outputCanvas, { quality })
            : await FileUtils.canvasToBlob(outputCanvas, mime, quality);
        }
        const ext     = FileUtils.extensionForMime(mime);
        const filename = file.name.replace(/\.[^.]+$/, '') + '_wm.' + ext;
        manager.setProgress(item.id, 100);
        manager.setStatus(item.id, 'Готово', 'status-done');
        manager.setMeta(item.id, FileUtils.formatSize(blob.size));
        manager.addDownload(item.id, blob, filename);
        results.push({ blob, filename });
      } catch (err) {
        errors++;
        manager.setStatus(item.id, 'Ошибка', 'status-error');
        manager.setMeta(item.id, err.message || 'Не удалось обработать GIF');
        console.error(err);
      }
    }

    if (results.length) {
      resultStats.innerHTML = `
        <div class="stat-card"><div class="stat-card__label">Обработано</div><div class="stat-card__value">${results.length}</div></div>
        <div class="stat-card stat-green"><div class="stat-card__label">Статус</div><div class="stat-card__value">Готово</div></div>
      `;
      UIUtils.showBatchResult({ resultArea, downloadAllBtn: dlAllBtn }, results.length);
      Toast.success('Водяной знак добавлен.');
    }
    if (errors) {
      Toast.error('Не удалось обработать ' + FileUtils.formatFilesCount(errors) + '.');
    }

    applyBtn.disabled = false;
    UIUtils.setBatchLocked(manager, [clearBtn, dlAllBtn, previewBtn], false);
    applyBtn.innerHTML = 'Добавить водяной знак';
  });

  dlAllBtn.addEventListener('click', async () => {
    await FileUtils.downloadZip(results, 'akd-watermarked.zip');
  });

})();
</script>
</body>
</html>
